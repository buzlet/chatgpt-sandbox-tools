# cloudflare-http-relay-selftest.yml
name: Cloudflare HTTP relay self-test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-http-relay-selftest.yml"
      - "cloudflare-http-relay/**"

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install sandbox codec dependency
        run: python -m pip install --disable-pip-version-check brotli

      - name: Generate one-time relay token
        shell: bash
        run: |
          token="$(python cloudflare-http-relay/generate_token.py)"
          echo "::add-mask::$token"
          echo "RELAY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Deploy temporary exact-byte echo target
        shell: bash
        run: |
          set +e
          npx --yes wrangler@^4.102.0 deploy \
            --temporary \
            --config cloudflare-http-relay/tests/wrangler.echo.jsonc \
            > "$RUNNER_TEMP/wrangler-echo.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Temporary echo Worker deployment failed (raw output withheld because it can contain claim credentials)." >&2
            exit "$rc"
          fi
          python cloudflare-http-relay/parse_deploy.py \
            "$RUNNER_TEMP/wrangler-echo.log" \
            "$RUNNER_TEMP/echo-deployment-private.json" \
            > "$RUNNER_TEMP/echo-url.txt"
          echo_url="$(cat "$RUNNER_TEMP/echo-url.txt")"
          echo "ECHO_URL=$echo_url" >> "$GITHUB_ENV"
          echo "Temporary echo Worker: $echo_url"

      - name: Wait for echo target health
        shell: bash
        run: |
          successes=0
          for n in $(seq 1 30); do
            if curl --fail --silent --show-error "$ECHO_URL/health" > "$RUNNER_TEMP/echo-health.json"; then
              successes=$((successes+1))
              if [ "$successes" -ge 2 ]; then
                cat "$RUNNER_TEMP/echo-health.json"
                exit 0
              fi
            else
              successes=0
            fi
            sleep 1
          done
          echo "Echo Worker did not stabilize" >&2
          exit 1

      - name: Deploy temporary relay Worker
        id: deploy
        shell: bash
        run: |
          set +e
          npx --yes wrangler@^4.102.0 deploy \
            --temporary \
            --config cloudflare-http-relay/wrangler.jsonc \
            --var "RELAY_TOKEN:$RELAY_TOKEN" \
            > "$RUNNER_TEMP/wrangler-deploy.log" 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "Wrangler temporary relay deployment failed (raw output withheld because it can contain claim credentials)." >&2
            exit "$rc"
          fi

          python cloudflare-http-relay/parse_deploy.py \
            "$RUNNER_TEMP/wrangler-deploy.log" \
            "$RUNNER_TEMP/deployment-private.json" \
            > "$RUNNER_TEMP/worker-url.txt"
          worker="$(cat "$RUNNER_TEMP/worker-url.txt")"
          echo "WORKER_URL=$worker" >> "$GITHUB_ENV"
          echo "worker_url=$worker" >> "$GITHUB_OUTPUT"
          echo "Temporary relay Worker: $worker"

      - name: Wait for relay Worker health
        shell: bash
        run: |
          successes=0
          for n in $(seq 1 30); do
            if curl --fail --silent --show-error "$WORKER_URL/health" > "$RUNNER_TEMP/health.json"; then
              successes=$((successes+1))
              if [ "$successes" -ge 3 ]; then
                cat "$RUNNER_TEMP/health.json"
                exit 0
              fi
            else
              successes=0
            fi
            sleep 1
          done
          echo "Relay Worker did not stabilize across edge propagation" >&2
          exit 1

      - name: Run real relay end-to-end suite
        env:
          SELFTEST_DIR: .selftest/cloudflare
        run: python cloudflare-http-relay/tests/e2e_selftest.py

      - name: Summary
        if: success()
        shell: bash
        run: |
          {
            echo "### Cloudflare HTTP relay self-test: PASS"
            echo "- Temporary relay Worker, Durable Object and separate echo Worker deployed"
            echo "- External UTF-8 JSON POST passed"
            echo "- Independent 401 -> 200 Authorization-header test passed"
            echo "- GET/HEAD/PUT/PATCH/DELETE/OPTIONS relay method matrix passed"
            echo "- 1024-byte arbitrary binary round-trip passed"
            echo "- /log agent/rid filtering passed"
            echo "- invalid relay token rejected and not logged"
            echo "- accumulated total statistics passed"
            echo "- browser HTML log view and secure cookie passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload non-secret self-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-http-relay-selftest-${{ github.run_id }}-${{ github.run_attempt }}
          path: .selftest/cloudflare/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 6
